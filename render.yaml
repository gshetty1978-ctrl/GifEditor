services:
  - type: web
    name: gifki
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /privacy
        destination: /privacy.gifki
      - type: redirect
        source: /privacy.html
        destination: /privacy.gifki
      - type: redirect
        source: /copyright
        destination: /copyright.gifki
      - type: redirect
        source: /copyright.html
        destination: /copyright.gifki
    headers:
      - path: /*.gifki
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
